site_name: Indice de Diversité Exposée
site_description: >-
  De la décohérence quantique à la polarisation algorithmique : modélisation
  thermodynamique de l'opinion publique.
site_author: Sylvain Geffroy
site_url: https://s-geffroy.github.io/Index-Dissipation-Entropique/
repo_url: https://github.com/s-geffroy/Index-Dissipation-Entropique
repo_name: s-geffroy/Index-Dissipation-Entropique
copyright: >-
  Code sous licence MIT · contenus rédactionnels sous licence CC BY 4.0

docs_dir: docs
# `docs/notebooks/` et `docs/figures/` sont recopiés depuis la racine avant le build
# (voir docker-compose.yml et .github/workflows/pages.yml) : les notebooks restent à
# leur place canonique, exécutable par `docker compose run --rm notebooks`, sans être
# dupliqués dans le dépôt.

theme:
  name: material
  language: fr
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Passer au thème sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Passer au thème clair
  features:
    # navigation.instant est volontairement absent : il est incompatible avec le
    # sélecteur de langue contextuel de mkdocs-static-i18n.
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Exposed Diversity Index
          nav_translations:
            Théorie: Theory
            Entropie: Entropy
            Température sociale: Social temperature
            Fokker-Planck: Fokker-Planck
            Résonance: Resonance
            Instruments: Instruments
            IDE — l'index: EDI — the index
            ADE — l'algorithme: EDA — the algorithm
            Calibration empirique: Empirical calibration
            Changements de régime: Regime changes
            Corpus étendu: Extended corpus
            Annotation en aveugle: Blind annotation
            Test adverse de l'index: Adversarial test of the index
            Rang et contrefactuel: Rank and counterfactual
            Rang adverse et sévérité: Adversarial rank and severity
            Exploration réelle de MIND: MIND's real exploration
            Journaux qui enregistrent le rang: Logs that record the rank
            Demande au titre de l'article 40: Article 40 data request
            Mémorandum de régulation: Regulatory memorandum
            Réserves: Caveats
            Audit critique et limites: Critical audit and limitations
            Feuille de route: Roadmap
            Errata: Errata
            Appel à relecture: Call for review
            Notebooks: Notebooks
  - mkdocs-jupyter:
      include: ["notebooks/*.ipynb"]
      execute: false
      include_source: true
      ignore_h1_titles: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/s-geffroy/Index-Dissipation-Entropique

nav:
  - Introduction: index.md
  - Théorie:
      - Entropie: theorie/entropie.md
      - Température sociale: theorie/temperature.md
      - Fokker-Planck: theorie/fokker-planck.md
      - Résonance: theorie/resonance.md
  - Instruments:
      - IDE — l'index: ide.md
      - ADE — l'algorithme: ade.md
      - Calibration empirique: calibration.md
      - Changements de régime: regimes.md
      - Corpus étendu: corpus-etendu.md
      - Annotation en aveugle: annotation.md
      - Test adverse de l'index: gaming.md
      - Rang et contrefactuel: evaluation.md
      - Rang adverse et sévérité: rang-adverse.md
      - Exploration réelle de MIND: mind.md
      - Journaux qui enregistrent le rang: rang-servi.md
      - Demande au titre de l'article 40: article-40.md
      - Mémorandum de régulation: memorandum.md
  - Réserves:
      - Audit critique et limites: limites.md
      - Feuille de route: feuille-de-route.md
      - Errata: errata.md
      - Appel à relecture: relecture.md
  - Notebooks:
      - 01 — Entropie et pureté: notebooks/01_entropie_et_purete.ipynb
      - 02 — Ising: notebooks/02_ising_temperature_sociale.ipynb
      - 03 — Voter Model: notebooks/03_voter_consensus_et_taille.ipynb
      - 04 — Fokker-Planck: notebooks/04_fokker_planck_paysage.ipynb
      - 05 — Hystérésis: notebooks/05_hysteresis_et_contre_champ.ipynb
      - 06 — Résonance: notebooks/06_resonance_larsen.ipynb
      - 07 — ADE: notebooks/07_ade_filtre_entropique.ipynb
      - 08 — Modèle à agents: notebooks/08_abm_compas_politique.ipynb
      - 09 — Calibration: notebooks/09_calibration_visibilite.ipynb
      - 10 — Changement de régime: notebooks/10_changement_de_regime.ipynb
      - 11 — Corpus étendu: notebooks/11_corpus_etendu.ipynb
      - 12 — Annotation en aveugle: notebooks/12_annotation_en_aveugle.ipynb
      - 13 — Test adverse: notebooks/13_test_adverse_index.ipynb
      - 14 — Rang et contrefactuel: notebooks/14_rang_et_contrefactuel.ipynb
      - 15 — Rang adverse: notebooks/15_rang_adverse_et_severite.ipynb
      - 16 — Exploration de MIND: notebooks/16_exploration_mind.ipynb
      - 17 — Rang servi: notebooks/17_rang_servi.ipynb
      - 18 — Demande article 40: notebooks/18_demande_article_40.ipynb
